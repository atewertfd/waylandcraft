plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import org.gradle.internal.logging.text.StyledTextOutputFactory;
import static org.gradle.internal.logging.text.StyledTextOutput.Style;

def isWindowsHost = System.getProperty("os.name").toLowerCase().contains("windows")
def skipNative = System.getenv("SKIP_NATIVE") == "1"

tasks.register("compileNative", Exec) {
	group = "build"
	description = "Build the platform native library with Cargo"
	workingDir file("native")
	commandLine nativeCargoCommand()
	args "build"
	environment "CARGO_TERM_COLOR", "always"
}

tasks.register("compileNativeRelease", Exec) {
	group = "build"
	description = "Build the platform native library in release mode"
	workingDir file("native")
	commandLine nativeCargoCommand()
	args "build", "--release"
	environment "CARGO_TERM_COLOR", "always"
}

if(isWindowsHost && !skipNative) {
	tasks.named("jar").configure {
		dependsOn("compileNative")
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Human readable list of compiled native libraries that were found
	def natives = []

	// Host-specific native library (Linux)
	def nativeFile = file("native/target/debug/libwaylandcraft.so")
	if(nativeFile.exists()) {
		from(nativeFile)
		natives.add("host-linux")
	}

	// Host-specific native library (Windows MSVC)
	def windowsDlls = [
		file("native/target/release/waylandcraft.dll"),
		file("native/target/debug/waylandcraft.dll")
	]
	def windowsDll = windowsDlls.find { it.exists() }
	if(windowsDll != null) {
		from(windowsDll) {
			rename { "waylandcraft-windows-msvc-x86_64.dll" }
		}
		from(windowsDll) {
			rename { "waylandcraft.dll" }
		}
		natives.add("host-windows-msvc-x86_64")
	}

	// Packaging of libraries in directory `native-libs`
	// Used by the actions runner for releases
	def targets = [
		"linux-gnu-x86_64",
		"linux-gnu-arm64"
	];

	for(def target in targets) {
		def f = file("native-libs/libwaylandcraft-${target}.so")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
		natives.add("${target}")
	}

	def packagedWindows = file("native-libs/waylandcraft-windows-msvc-x86_64.dll")
	if(packagedWindows.exists() && windowsDll == null) {
		from(packagedWindows)
		from(packagedWindows) {
			rename { "waylandcraft.dll" }
		}
		natives.add("windows-msvc-x86_64")
	}

	if(natives.size() < 1) {
		services
			.get(StyledTextOutputFactory)
			.create("waylandcraft")
			.withStyle(Style.Failure)
			.println("WARNING: Native library not built! The built mod will not contain native code");
	}
	else {
		services
			.get(StyledTextOutputFactory)
			.create("waylandcraft")
			.withStyle(Style.Success)
			.println("Packaging native libraries: " + natives.join(", "));
	}
}

static def nativeCargoCommand() {
	def cargoEnv = System.getenv("CARGO")
	if(cargoEnv != null && !cargoEnv.isBlank()) {
		return cargoEnv
	}
	def extra = [
		new File(System.getProperty("user.home"), ".cargo/bin/cargo.exe"),
		new File(System.getProperty("user.home"), ".cargo/bin/cargo"),
		new File("C:/Program Files/Rust stable MSVC 1.96/bin/cargo.exe"),
		new File("C:/Program Files/Rust stable GNU 1.96/bin/cargo.exe")
	]
	def found = extra.find { it.exists() }
	return found != null ? found.absolutePath : "cargo"
}

loom {
	runs {
		client {
			environmentVariable("LD_LIBRARY_PATH", "../native/target/debug/")
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
			environmentVariable("RUST_BACKTRACE", "1")
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
