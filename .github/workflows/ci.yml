name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux native + Fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-linux-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml') }}
      - name: Cargo fmt
        working-directory: native
        run: cargo fmt --check
      - name: Cargo test
        working-directory: native
        run: cargo test
      - name: Cargo clippy
        working-directory: native
        run: cargo clippy --all-targets
      - name: Build native library
        working-directory: native
        run: cargo build
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle check/build
        run: ./gradlew check build
        env:
          SKIP_NATIVE: "1"
      - name: Inspect JAR
        run: |
          set -euo pipefail
          JAR=build/libs/waylandcraft.jar
          echo "JAR=$JAR"
          ls -la build/libs
          jar tf "$JAR" | tee /tmp/jar-list.txt
          grep -E '(^|/)libwaylandcraft\.so$|(^|/)libwaylandcraft-linux-gnu-' /tmp/jar-list.txt
          python3 - <<'PY'
          import json, zipfile, glob
          jar = glob.glob("build/libs/waylandcraft*.jar")[0]
          with zipfile.ZipFile(jar) as z:
              data = json.loads(z.read("fabric.mod.json"))
          print(data)
          assert "26.2" in str(data["depends"]["minecraft"]), data
          assert data["depends"]["java"] == ">=25"
          PY
      - name: Upload Linux JAR
        uses: actions/upload-artifact@v4
        with:
          name: waylandcraft-linux
          path: build/libs/waylandcraft*.jar

  windows:
    name: Windows native + Fabric
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-windows-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml') }}
      - name: Cargo fmt
        working-directory: native
        run: cargo fmt --check
      - name: Cargo test
        working-directory: native
        run: cargo test
      - name: Cargo clippy
        working-directory: native
        run: cargo clippy --all-targets
      - name: Build native DLL
        working-directory: native
        run: cargo build
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle build
        run: .\gradlew.bat check build
      - name: Inspect JAR
        shell: pwsh
        run: |
          $jar = Get-Item build/libs/waylandcraft.jar
          Write-Host "JAR=$($jar.FullName)"
          Get-ChildItem build/libs | ForEach-Object { $_.Name }
          jar tf $jar.FullName | Tee-Object -FilePath jar-list.txt
          if (-not (Select-String -Path jar-list.txt -Pattern "waylandcraft-windows-msvc-x86_64.dll" -Quiet)) {
            throw "Windows DLL missing from JAR"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          try {
            $entry = $zip.GetEntry("fabric.mod.json")
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $json = $reader.ReadToEnd() | ConvertFrom-Json
            $reader.Close()
            Write-Host ($json | ConvertTo-Json -Depth 6)
            if ($json.depends.minecraft -notmatch "26.2") { throw "fabric.mod.json does not accept Minecraft 26.2" }
          } finally {
            $zip.Dispose()
          }
      - name: Upload Windows JAR
        uses: actions/upload-artifact@v4
        with:
          name: waylandcraft-windows
          path: build/libs/waylandcraft*.jar
