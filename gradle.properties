# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Official Fabric example-mod 26.2 baseline: loader 0.19.5, loom 1.17, fabric-api 0.159.0+26.2
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
# Unofficial Windows + 26.2 port version. Upstream WaylandCraft remains 2.0.3 / 26.1.2.
mod_version=2.1.0-windows.26.2-alpha.1
maven_group=dev.evvie.waylandcraft
archives_base_name=waylandcraft

# Dependencies
fabric_version=0.159.0+26.2
iris_version=1.11.2+26.2-fabric
